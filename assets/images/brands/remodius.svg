<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 65" width="200" height="65">
  <g fill="#1E1E1E">
    <!-- Mountain logo icon -->
    <g transform="translate(18, 22)">
      <polygon points="12,20 22,5 32,20" fill="none" stroke="#1E1E1E" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="4,20 12,9 20,20" fill="none" stroke="#1E1E1E" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Snowcap peak -->
      <polygon points="22,5 19,10 22,8 25,10" fill="#1E1E1E"/>
    </g>
    <!-- Brand text REMODIUS -->
    <text x="120" y="40" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="21" font-weight="900" letter-spacing="2.5" text-anchor="middle">REMODIUS</text>
  </g>
</svg>
